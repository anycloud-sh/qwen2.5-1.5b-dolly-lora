[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qwen2.5-1.5b-dolly-lora"
version = "0.1.0"
description = "AnyCloud-powered LoRA fine-tune of Qwen2.5-1.5B-Instruct on Dolly 15k that resumes after interruptions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "accelerate==1.10.1",
  "peft==0.20.0",
  "safetensors==0.6.2",
  "torch==2.8.0",
  "transformers==5.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.14.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dolly_lora"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "T20"]
